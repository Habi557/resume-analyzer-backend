# ResumeAnalysis concurrency
resume.analysis.page-size=5
resume.analysis.ai-concurrency=2



# circuit braker config
# Circuit Breaker - aiCircuitBreaker instance
resilience4j.circuitbreaker.instances.aiCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiCircuitBreaker.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.aiCircuitBreaker.slow-call-duration-threshold=80s
resilience4j.circuitbreaker.instances.aiCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiCircuitBreaker.wait-duration-in-open-state=120s
resilience4j.circuitbreaker.instances.aiCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.aiCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Time Limiter - aiCircuitBreaker instance
resilience4j.timelimiter.instances.aiCircuitBreaker.timeout-duration=100s
resilience4j.timelimiter.instances.aiCircuitBreaker.cancel-running-future=true
# ── Bulkhead (max 5 concurrent submissions) ──────
resilience4j.bulkhead.instances.aiCircuitBreaker.max-concurrent-calls=5
resilience4j.bulkhead.instances.aiCircuitBreaker.max-wait-duration=110s

# ── Retry ────────────────────────────────────────
resilience4j.retry.instances.aiCircuitBreaker.max-attempts=2
resilience4j.retry.instances.aiCircuitBreaker.wait-duration=5s
# ------ Retry for ai api call Retry
# Retry executes first
resilience4j.retry.retry-aspect-order=1
resilience4j.retry.instances.aiRetry.max-attempts=2
resilience4j.retry.instances.aiRetry.wait-duration=2s
resilience4j.retry.instances.aiRetry.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
# Circuit Breaker executes after Retry
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

# -- Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false




